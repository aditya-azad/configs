background {
    monitor =
    path = screenshot
    blur_size = 4
    blur_passes = 3
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(33ccffee)
    inner_color = rgba(232627ff)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = true
    placeholder_text =
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(cdd6f4ff)
    font_size = 90
    font_family = Sans
    position = 0, 120
    halign = center
    valign = center
}
