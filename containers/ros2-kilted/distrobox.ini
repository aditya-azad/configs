# containers/ros2-kilted/distrobox.ini
# Distrobox config for the ros2-kilted box. Same shape as ros2-humble; distinct
# default ROS_DOMAIN_ID is set in init.sh.
[ros2-kilted]
image = localhost/ros2-kilted:latest
nvidia = true
init = false
additional_packages = ""
volume = /dev:/dev :/run/udev:/run/udev
entry = /bin/bash
