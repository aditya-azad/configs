# containers/ros2-humble/distrobox.ini
# Distrobox config for the ros2-humble box. GPU passthrough via nvidia=true
# (host driver); the container's own CUDA toolkit provides the rest. Host
# network so DDS multicast reaches real robots on the LAN.
[ros2-humble]
image = localhost/ros2-humble:latest
nvidia = true
init = false
additional_packages = ""
# USB flight controllers for HITL + udev for device enumeration.
volume = /dev:/dev :/run/udev:/run/udev
entry = /bin/bash
