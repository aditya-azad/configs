# Desktop-specific
ros_domain_id: 0

# NVIDIA driver line (CUDA itself is not installed on the host; PyTorch
# wheels bundle the runtime, and CUDA-C compilation lives in distrobox).
nvidia_driver_version: 580
px4_path: "{{ ansible_env.HOME }}/code/PX4-Autopilot"
