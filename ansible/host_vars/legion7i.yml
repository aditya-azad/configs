  - bacon
  - cargo_info
  - heif
  - krita
  - keepass2
  - xournalpp
  - calibre
  - du_dust
  - ripgrep
  - eza
  - brave
  - nvidia_driver
  - latex
  - nvtop
  - texlab
  - neovim
  - refree
  - python_lsp
  - kitty
  - ros2
