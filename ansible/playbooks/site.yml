---
# Site playbook. Each host runs only the programs it selected (host_vars `programs`).
#
#   ansible-playbook playbooks/site.yml                  # all hosts
#   ansible-playbook playbooks/site.yml -l legion7i      # desktop only
#   ansible-playbook playbooks/site.yml -l eagle         # jetson only
#   ansible-playbook playbooks/site.yml --tags neovim    # single program (tagged)
#   ansible-playbook playbooks/site.yml --skip-tags upgrade
#
# Each entry in `programs` maps to tasks/<name>.yml, which installs and configures
# exactly that piece of software, idempotently.

- name: Provision host according to its selected programs
  hosts: workstations
  become: true
  gather_facts: true

  pre_tasks:
    - name: Ensure configs repo exists at {{ configs_repo }}
      ansible.builtin.git:
        repo: "https://github.com/aditya-azad/configs.git"
        dest: "{{ configs_repo }}"
        version: main
      become: false
      tags: always

  tasks:
    - name: Run selected programs
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/{{ item }}.yml"
      loop: "{{ programs }}"
      loop_control:
        label: "{{ item }}"
      tags: always
