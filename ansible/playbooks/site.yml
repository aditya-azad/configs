---

- name: Provision host according to its selected programs
  hosts: workstations
  become: true
  gather_facts: true

  environment:
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ user_uid | default(omit) }}/bus"
    XDG_RUNTIME_DIR: "/run/user/{{ user_uid | default(omit) }}"

  pre_tasks:
    - name: Resolve target user uid (run as root)
      ansible.builtin.command: "id -u {{ username }}"
      changed_when: false
      register: user_uid_res

    - name: Set user_uid fact
      ansible.builtin.set_fact:
        user_uid: "{{ user_uid_res.stdout }}"

    - name: Ensure SSH key exists + prompt for GitHub access
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/ssh_key.yml"
      tags: always

    - name: Configure git identity + ssh-agent (before any clone)
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/git.yml"
      tags: always

    - name: Ensure code_dir + software_dir exist (before any clone/copy)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
        owner: "{{ username }}"
      loop:
        - "{{ code_dir }}"
        - "{{ software_dir }}"

    - name: Install rustup (prerequisite for cargo-based programs)
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/rust.yml"
      tags: always

  tasks:
    - name: Run selected programs
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/{{ item }}.yml"
      loop: "{{ programs }}"
      loop_control:
        label: "{{ item }}"
      tags: always
