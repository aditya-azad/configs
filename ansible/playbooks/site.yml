---
# Site playbook. Each host runs only the programs it selected (host_vars `programs`).
#
#   sudo ansible-playbook playbooks/site.yml                  # all hosts
#   sudo ansible-playbook playbooks/site.yml -l legion7i      # desktop only
#   sudo ansible-playbook playbooks/site.yml -l eagle         # jetson only
#   sudo ansible-playbook playbooks/site.yml --tags neovim    # single program (tagged)
#   sudo ansible-playbook playbooks/site.yml --skip-tags upgrade
#
# Each entry in `programs` maps to tasks/<name>.yml, which installs and configures
# exactly that piece of software, idempotently.

- name: Provision host according to its selected programs
  hosts: workstations
  become: true
  gather_facts: true

  pre_tasks:
    - name: Resolve target user uid (run as root)
      ansible.builtin.command: "id -u {{ username }}"
      changed_when: false
      register: user_uid_res

    - name: Set user_uid fact
      ansible.builtin.set_fact:
        user_uid: "{{ user_uid_res.stdout }}"

  tasks:
    - name: Run selected programs
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/{{ item }}.yml"
      loop: "{{ programs }}"
      loop_control:
        label: "{{ item }}"
      tags: always
