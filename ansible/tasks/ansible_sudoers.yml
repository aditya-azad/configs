---
# tasks/ansible_sudoers.yml — passwordless sudo for the ansible user.
#
# Required because the play uses `become: true` and ansible.cfg sets
# `become_ask_pass = False`. On an `ansible_connection=local` host
# (legion7i), interactive sudo prompts are written to the TTY and never
# reach Ansible's pipe-based local connection, causing
# "Timed out waiting for become success or become password prompt".
# Passwordless sudo via a sudoers.d drop-in avoids that fragility.
#
# BOOTSTRAP (one-time, manual, per host): this task cannot install the
# drop-in on the first run because it itself needs `become: true` to write
# /etc/sudoers.d, and without the drop-in sudo cannot elevate yet. Seed it
# once on each host before the first playbook run:
#
#     echo "<username> ALL=(ALL) NOPASSWD:ALL" | \
#       sudo tee /etc/sudoers.d/<username>-ansible
#     sudo chmod 0440 /etc/sudoers.d/<username>-ansible
#     sudo visudo -cf /etc/sudoers.d/<username>-ansible
#
# After that, this task keeps the drop-in idempotent (re-creates it if
# content/mode drift) and validates syntax with visudo before committing.
# Must be the first entry in each host's `programs` list.

- name: Ensure sudoers drop-in directory exists
  ansible.builtin.file:
    path: /etc/sudoers.d
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Stage passwordless sudoers drop-in for {{ username }} (validated)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/{{ username }}-ansible.new
    content: "{{ username }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    owner: root
    group: root
  check_mode: false
  register: sudoers_stage

- name: Validate staged sudoers drop-in with visudo
  ansible.builtin.command: visudo -cf /etc/sudoers.d/{{ username }}-ansible.new
  changed_when: false
  register: sudoers_check
  failed_when: sudoers_check.rc != 0

- name: Install passwordless sudoers drop-in for {{ username }}
  ansible.builtin.copy:
    dest: /etc/sudoers.d/{{ username }}-ansible
    src: /etc/sudoers.d/{{ username }}-ansible.new
    remote_src: true
    mode: "0440"
    owner: root
    group: root
  when: sudoers_stage.changed

- name: Remove staged sudoers drop-in
  ansible.builtin.file:
    path: /etc/sudoers.d/{{ username }}-ansible.new
    state: absent
