---

- name: Install font packages
  ansible.builtin.apt:
    name:
      - fonts-noto
      - fonts-noto-core
      - fonts-noto-color-emoji
      - fonts-firacode
    state: present

- name: Ensure user fontconfig dir exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.config/fontconfig"
    state: directory
    mode: "0755"
  become: true
  become_user: "{{ username }}"

- name: Drop user fontconfig preset (Noto + FiraCode Nerd Font + emoji)
  ansible.builtin.copy:
    dest: "{{ home_dir }}/.config/fontconfig/fonts.conf"
    mode: "0644"
    content: |
      <?xml version="1.0"?>
      <!DOCTYPE fontconfig SYSTEM "urn:fonts:dtd:fontconfig">
      <fontconfig>
        <alias><family>serif</family>      <prefer><family>Noto Serif</family>      <family>Noto Color Emoji</family></prefer></alias>
        <alias><family>sans-serif</family> <prefer><family>Noto Sans</family>       <family>Noto Color Emoji</family></prefer></alias>
        <alias><family>monospace</family>  <prefer><family>FiraCode Nerd Font</family><family>Noto Color Emoji</family></prefer></alias>
        <alias><family>emoji</family>      <prefer><family>Noto Color Emoji</family></prefer></alias>
      </fontconfig>
  become: true
  become_user: "{{ username }}"

- name: Ensure user fonts dir exists (for the FiraCode Nerd Font zip from the repo)
  ansible.builtin.file:
    path: "{{ home_dir }}/.local/share/fonts"
    state: directory
    mode: "0755"
  become: true
  become_user: "{{ username }}"

- name: Unzip FiraCode Nerd Font into user fonts dir
  ansible.builtin.unarchive:
    src: "{{ configs_repo }}/font/FiraCode.zip"
    dest: "{{ home_dir }}/.local/share/fonts"
    remote_src: true
    creates: "{{ home_dir }}/.local/share/fonts/FiraCodeNerdFont-Regular.ttf"
  become: true
  become_user: "{{ username }}"

- name: Refresh font cache
  ansible.builtin.command: fc-cache -f
  environment:
    HOME: "{{ home_dir }}"
  changed_when: false
