---
# ── Runtime helpers hyprbuntu does not install ───────────────────────────────
- name: Hyprland — install runtime helpers
  ansible.builtin.apt:
    name:
      - wlsunset   # night-light helper
      - kanshi      # per-setup monitor profiles (auto-switches on hotplug)
    state: present

# ── nwg-displays: GUI monitor arranger (read-only helper for kanshi) ────────
- name: nwg-displays — install build & runtime deps
  ansible.builtin.apt:
    name:
      # Language-agnostic GObject-introspection typelibs + runtime libs (used by
      # any python's `gi`, incl. the mise python). No system-python bindings are
      # installed here: nwg-displays is built & run under mise-managed python.
      - gir1.2-gtk-3.0
      - gir1.2-gtk-layer-shell-0.1
      - libgtk-layer-shell0
      # Headers needed to compile PyGObject (the `gi` module) for the mise python:
      - libgirepository1.0-dev
      - libcairo2-dev
      - libglib2.0-dev
      - pkg-config
      - gobject-introspection
      - git
    state: present

- name: nwg-displays — clone repo
  ansible.builtin.git:
    repo: https://github.com/nwg-piotr/nwg-displays.git
    dest: "{{ code_dir }}/nwg-displays"
    version: "v0.4.4"
    depth: 1
  become: true
  become_user: "{{ username }}"

- name: nwg-displays — install python build tools & runtime deps (mise python)
  ansible.builtin.shell: |
    set -e
    eval "$({{ mise_bin }} activate bash)"
    python -m pip install --upgrade \
      build installer wheel setuptools \
      pygobject i3ipc
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ username }}"
  register: nwg_pip
  changed_when: "'Successfully installed' in (nwg_pip.stdout | default(''))"

- name: nwg-displays — build & install wheel (mise python)
  ansible.builtin.shell: |
    set -e
    eval "$({{ mise_bin }} activate bash)"
    cd "{{ code_dir }}/nwg-displays"
    rm -rf dist
    python -m build --wheel --no-isolation
    python -m installer dist/*.whl
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ username }}"
  creates: "{{ home_dir }}/.local/share/mise/installs/python/3.14/bin/nwg-displays"

- name: nwg-displays — system integration (.desktop, icon, PATH symlink)
  ansible.builtin.shell: |
    set -e
    cd "{{ code_dir }}/nwg-displays"
    install -Dm 644 -t /usr/share/applications nwg-displays.desktop
    install -Dm 644 -t /usr/share/pixmaps nwg-displays.svg
    ln -sf "{{ home_dir }}/.local/share/mise/installs/python/3.14/bin/nwg-displays" \
      /usr/local/bin/nwg-displays
  args:
    executable: /bin/bash
    creates: /usr/local/bin/nwg-displays

# ── Recommended Wayland/Hyprland desktop apps ───────────────────────────────
- name: Hyprland — install recommended desktop apps
  ansible.builtin.apt:
    name:
      - thunar                 # file manager (replaces nautilus)
      - thunar-archive-plugin  # thunar: extract/create archives
      - thunar-volman          # thunar: removable media
      - file-roller            # archive backend for thunar-archive-plugin
      - gvfs                   # trash / mounts / recent in thunar
      - gvfs-backends
      - mpv                    # video player (replaces vlc/totem)
      - imv                    # image viewer (replaces eog) — Wayland-native
      - zathura                # document viewer (replaces evince/papers)
      - zathura-pdf-poppler    # zathura: PDF backend
      - zathura-djvu           # zathura: DjVu backend
      - zathura-cb             # zathura: comic-book backend
      - qalculate-gtk          # calculator (replaces gnome-calculator)
      - blueman                # bluetooth (replaces gnome-bluetooth)
      - pavucontrol            # audio mixer (replaces gnome sound settings)
      - brightnessctl          # backlight control (replaces gnome power)
    state: present

# ── Hyprland + ecosystem: build from source via hyprbuntu (Ubuntu 26.04) ────
- name: Hyprland — download hyprbuntu installer
  ansible.builtin.get_url:
    url: https://gitlab.com/kralos/hyprbuntu/-/raw/main/hyprbuntu.sh
    dest: "{{ home_dir }}/.local/bin/hyprbuntu.sh"
    mode: "0755"
    force: true
  become: true
  become_user: "{{ username }}"

- name: Hyprland — run hyprbuntu installer (build from source, gcc-16)
  ansible.builtin.shell: |
    set -e
    {{ home_dir }}/.local/bin/hyprbuntu.sh
  args:
    executable: /bin/bash
    creates: /usr/bin/Hyprland
  become: true
  become_user: "{{ username }}"
  environment:
    BUILD_DIR: "{{ code_dir }}/hyprbuntu"
    DISABLE_CONFIRM: "true"
    HYPRIDLE_SETUP: "true"
    HYPRLOCK_SETUP: "true"
    HYPRPAPER_SETUP: "true"       # wallpaper daemon; config written by `st` setter
    HYPRSHOT_SETUP: "true"
    NOTIFICATION_DAEMON_PREF: "swaync"
    NVIDIA_SETUP: "true"          # legion7i has NVIDIA; hyprbuntu auto-detects too
    SWAYOSD_SETUP: "true"
    THEME_PREF: "none"            # theme is toggled manually via `st`, not pinned here
    THUNAR_SETUP: "false"          # thunar installed idempotently via apt below
    TUIGREET_SETUP: "true"         # greetd + tuigreet login manager (replaces GDM)
    WAYBAR_SETUP: "true"

# ── Appearance (gsettings, read by GTK via dconf under any session) ──────────
- name: Hyprland — GTK / interface settings
  ansible.builtin.shell: "gsettings set {{ item.schema }} {{ item.key }} \"{{ item.value }}\""
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ username }}"
  changed_when: false
  loop:
    - { schema: "org.gnome.desktop.interface", key: "icon-theme", value: "Yaru" }
    - { schema: "org.gnome.desktop.interface", key: "gtk-theme", value: "Adwaita" }
    - { schema: "org.gnome.desktop.interface", key: "enable-animations", value: "false" }
    - { schema: "org.gnome.desktop.interface", key: "clock-format", value: "'12h'" }
    - { schema: "org.gnome.desktop.peripherals.keyboard", key: "delay", value: "150" }
    - { schema: "org.gnome.desktop.input-sources", key: "xkb-options", value: "['caps:none']" }
  # color-scheme is intentionally NOT set here — it is toggled by the `st`
  # theme-switch script (setters/gtk.sh) so dark/light follows your choice.

# ── Default browser & terminal ───────────────────────────────────────────────
- name: Hyprland — default browser & terminal
  ansible.builtin.shell: "{{ item }}"
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ username }}"
  changed_when: false
  loop:
    - "xdg-settings set default-web-browser brave-browser.desktop"
    - "gsettings set org.gnome.desktop.default-applications.terminal exec 'kitty'"
    - "gsettings set org.gnome.desktop.default-applications.terminal exec-arg ''"

- name: Hyprland — register kitty as x-terminal-emulator alternative
  ansible.builtin.shell: |
    update-alternatives --install /usr/bin/x-terminal-emulator x-terminal-emulator "$(which kitty)" 50
  args:
    executable: /bin/bash
  changed_when: false

# ── Boot splash: simple spinner (replaces Ubuntu's branded animation) ───────
- name: Plymouth — install simple spinner theme
  ansible.builtin.apt:
    name: plymouth-theme-spinner
    state: present

- name: Plymouth — read current default theme
  ansible.builtin.command: plymouth-set-default-theme
  changed_when: false
  register: plymouth_current_theme
  failed_when: false

- name: Plymouth — set spinner as default theme + rebuild initrd
  ansible.builtin.command: plymouth-set-default-theme -R spinner
  when: plymouth_current_theme.stdout | trim != 'spinner'

# ── Power: lid-close → nothing ───────────────────────────────────────────────
- name: Hyprland — logind lid-close = ignore
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/lid.conf
    mode: "0644"
    content: |
      [Login]
      HandleLidSwitch=ignore
      HandleLidSwitchExternalMonitors=ignore
      HandleLidSwitchDocked=ignore
