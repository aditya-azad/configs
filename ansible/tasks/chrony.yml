---

- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present

- name: Disable systemd-timesyncd so chrony owns the clock
  ansible.builtin.systemd:
    name: systemd-timesyncd.service
    state: stopped
    enabled: false
  failed_when: false

- name: Ensure chrony is enabled and running
  ansible.builtin.systemd:
    name: chronyd
    state: started
    enabled: true
