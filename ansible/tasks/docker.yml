---

- name: Install docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: true

- name: Map kernel arch to Debian apt arch
  ansible.builtin.set_fact:
    docker_apt_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_facts.architecture, ansible_facts.architecture) }}"

- name: Add Docker apt repo
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ docker_apt_codename | default('noble') }} stable"
    filename: docker
    state: present
    update_cache: true

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Download Docker Desktop deb
  ansible.builtin.get_url:
    url: "https://desktop.docker.com/linux/main/amd64/docker-desktop-amd64.deb"
    dest: /tmp/docker-desktop-amd64.deb
    mode: "0644"
    force: false
  when: ansible_facts.architecture == "x86_64"

- name: Install Docker Desktop
  ansible.builtin.apt:
    deb: /tmp/docker-desktop-amd64.deb
    state: present
  when: ansible_facts.architecture == "x86_64"