---
# tasks/nvidia_container_toolkit.yml — NVIDIA Container Toolkit (jetson, pinned 1.17.8-1).
# Idempotent: apt keyring + repo + package state=present.

- name: Install curl
  ansible.builtin.apt:
    name: curl
    state: present

- name: Download NVIDIA container toolkit GPG key
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
    mode: "0644"
    force: true

- name: Fetch & install toolkit repo list (signed-by)
  ansible.builtin.shell: |
    set -e
    curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list \
      | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' \
      > /etc/apt/sources.list.d/nvidia-container-toolkit.list
  args:
    executable: /bin/bash
  changed_when: false

- name: Install NVIDIA container toolkit (pinned 1.17.8-1)
  ansible.builtin.apt:
    name:
      - "nvidia-container-toolkit=1.17.8-1"
      - "nvidia-container-toolkit-base=1.17.8-1"
      - "libnvidia-container-tools=1.17.8-1"
      - "libnvidia-container1=1.17.8-1"
    state: present
    update_cache: true
