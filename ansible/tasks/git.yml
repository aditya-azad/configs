---
# tasks/git.yml — git identity + SSH key. Runs as the user.
# Identity comes from host_vars (git_full_name / git_email).

- name: Configure git user.name
  community.general.git_config:
    name: user.name
    value: "{{ git_full_name }}"
    scope: global
  become: false

- name: Configure git user.email
  community.general.git_config:
    name: user.email
    value: "{{ git_email }}"
    scope: global
  become: false

- name: Ensure ~/.ssh exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh"
    state: directory
    mode: "0700"
  become: false

- name: Generate ed25519 SSH key (if absent)
  ansible.builtin.shell: |
    ssh-keygen -t ed25519 -C "{{ git_email }}" -f {{ ansible_env.HOME }}/.ssh/id_ed25519 -N ""
  args:
    creates: "{{ ansible_env.HOME }}/.ssh/id_ed25519"
  become: false

- name: Ensure ssh-agent is running
  ansible.builtin.shell: |
    eval "$(ssh-agent -s)"
    ssh-add {{ ansible_env.HOME }}/.ssh/id_ed25519 2>/dev/null || true
  args:
    executable: /bin/bash
  become: false
  changed_when: false
