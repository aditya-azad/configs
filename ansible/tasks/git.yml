---
# tasks/git.yml — git identity + ssh-agent. Runs as the user.
# Identity comes from host_vars (git_full_name / git_email). The SSH key
# itself is created earlier by tasks/ssh_key.yml (pre-task in site.yml).

- name: Configure git user.name
  community.general.git_config:
    name: user.name
    value: "{{ git_full_name }}"
    scope: global
  become: true
  become_user: "{{ username }}"

- name: Configure git user.email
  community.general.git_config:
    name: user.email
    value: "{{ git_email }}"
    scope: global
  become: true
  become_user: "{{ username }}"

- name: Ensure ssh-agent is running
  ansible.builtin.shell: |
    eval "$(ssh-agent -s)"
    ssh-add {{ home_dir }}/.ssh/id_ed25519 2>/dev/null || true
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ username }}"
  changed_when: false
