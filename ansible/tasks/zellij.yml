---

- name: Install zellij via cargo
  ansible.builtin.shell: |
    set -e
    source {{ cargo_env }}
    cargo install zellij
  args:
    executable: /bin/bash
    creates: "{{ cargo_bin }}/zellij"
  become: true
  become_user: "{{ username }}"

- name: Link zellij config
  ansible.builtin.file:
    src: "{{ configs_repo }}/zellij"
    dest: "{{ home_dir }}/.config/zellij"
    state: link
    force: true
  become: true
  become_user: "{{ username }}"
