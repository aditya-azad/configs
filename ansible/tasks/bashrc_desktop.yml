---
# tasks/bashrc_desktop.yml — desktop-specific shell config (legion7i).
# Idempotent via blockinfile; the rdid function uses fixed markers.

- name: Desktop bashrc — prompt
  ansible.builtin.blockinfile:
    path: "{{ bashrc_file }}"
    marker: "# {mark} ANSIBLE desktop-prompt"
    block: |
      PS1='\[\e[38;5;28m\]\u@\h:\w\[\e[0m\]$ '

- name: Desktop bashrc — directories
  ansible.builtin.blockinfile:
    path: "{{ bashrc_file }}"
    marker: "# {mark} ANSIBLE desktop-directories"
    block: |
      alias cdw='cd ~/database/workspace'

- name: Desktop bashrc — utils
  ansible.builtin.blockinfile:
    path: "{{ bashrc_file }}"
    marker: "# {mark} ANSIBLE desktop-utils"
    block: |
      alias cat='bat'

- name: Desktop bashrc — documents
  ansible.builtin.blockinfile:
    path: "{{ bashrc_file }}"
    marker: "# {mark} ANSIBLE desktop-documents"
    block: |
      alias todo='nvim ~/database/workspace/inbox.md'
      alias ideas='nvim ~/database/workspace/ideas.md'
      alias notes='nvim ~/database/workspace/notes'

- name: Desktop bashrc — robotics
  ansible.builtin.blockinfile:
    path: "{{ bashrc_file }}"
    marker: "# {mark} ANSIBLE desktop-robotics"
    block: |
      alias qgc='QGroundControl-x86_64.AppImage'
      export PX4_PATH={{ px4_path }}

- name: Desktop bashrc — ssh aliases
  ansible.builtin.blockinfile:
    path: "{{ bashrc_file }}"
    marker: "# {mark} ANSIBLE desktop-ssh"
    block: |
      alias e7='ssh -Y eagle7@eagle7'
      alias e7j='ssh -Y eagle7@jetson'

- name: Desktop bashrc — rdid function
  ansible.builtin.blockinfile:
    path: "{{ bashrc_file }}"
    marker: "# {mark} ANSIBLE desktop-rdid >>> block >>>"
    block: |
      # Usage: rdid 23
      # Sets ROS_DOMAIN_ID in current shell and persists it in ~/.bashrc
      rdid() {
        if [ -z "${1-}" ]; then
          echo "Usage: rdid <domain_id>" >&2
          return 2
        fi

        case "$1" in
          ""|*[!0-9]*)
            echo "Error: domain_id must be a non-negative integer." >&2
            return 2
            ;;
          *)
            if [ "$1" -gt 232 ] 2>/dev/null; then
              echo "Warning: domain_id > 232 may be unsupported by some ROS 2 setups." >&2
            fi
            ;;
        esac

        local id="$1"
        local bashrc="$HOME/.bashrc"
        local line="export ROS_DOMAIN_ID=${id}"

        export ROS_DOMAIN_ID="$id"

        if grep -qE "^[[:space:]]*export[[:space:]]+ROS_DOMAIN_ID=[0-9]+" "$bashrc"; then
          sed -i.bak -E "s|^[[:space:]]*export[[:space:]]+ROS_DOMAIN_ID=[0-9]+$|$line|" "$bashrc"
        else
          printf "\n%s\n" "$line" >> "$bashrc"
        fi

        echo "ROS_DOMAIN_ID set to ${id} (current shell) and persisted in ~/.bashrc"
      }

- name: Desktop bashrc — persist ROS_DOMAIN_ID
  ansible.builtin.lineinfile:
    path: "{{ bashrc_file }}"
    regexp: '^\s*export\s+ROS_DOMAIN_ID=[0-9]+$'
    line: "export ROS_DOMAIN_ID={{ ros_domain_id }}"
