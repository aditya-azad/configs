---

- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.local/bin"
    state: directory
    mode: "0755"
  become: true
  become_user: "{{ username }}"

- name: Install kitty via official installer
  ansible.builtin.shell: |
    set -e
    curl -L https://sw.kovidgoyal.net/kitty/installer.sh | sh /dev/stdin
  args:
    executable: /bin/bash
    creates: "{{ home_dir }}/.local/kitty.app/bin/kitty"
  become: true
  become_user: "{{ username }}"

- name: Symlink kitty & kitten into ~/.local/bin
  ansible.builtin.file:
    src: "{{ home_dir }}/.local/kitty.app/bin/{{ item }}"
    dest: "{{ home_dir }}/.local/bin/{{ item }}"
    state: link
    force: true
  become: true
  become_user: "{{ username }}"
  loop:
    - kitty
    - kitten

- name: Ensure applications dir exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.local/share/applications"
    state: directory
    mode: "0755"
  become: true
  become_user: "{{ username }}"

- name: Copy kitty desktop files
  ansible.builtin.copy:
    src: "{{ home_dir }}/.local/kitty.app/share/applications/{{ item }}"
    dest: "{{ home_dir }}/.local/share/applications/{{ item }}"
    remote_src: true
    mode: "0644"
    force: true
  become: true
  become_user: "{{ username }}"
  loop:
    - kitty.desktop
    - kitty-open.desktop

- name: Patch icon path in kitty desktop files
  ansible.builtin.replace:
    path: "{{ home_dir }}/.local/share/applications/{{ item }}"
    regexp: 'Icon=kitty'
    replace: "Icon={{ home_dir }}/.local/kitty.app/share/icons/hicolor/256x256/apps/kitty.png"
  become: true
  become_user: "{{ username }}"
  loop:
    - kitty.desktop
    - kitty-open.desktop

- name: Patch exec path in kitty desktop files
  ansible.builtin.replace:
    path: "{{ home_dir }}/.local/share/applications/{{ item }}"
    regexp: 'Exec=kitty'
    replace: "Exec={{ home_dir }}/.local/kitty.app/bin/kitty"
  become: true
  become_user: "{{ username }}"
  loop:
    - kitty.desktop
    - kitty-open.desktop

- name: Link kitty config
  ansible.builtin.file:
    src: "{{ configs_repo }}/kitty"
    dest: "{{ home_dir }}/.config/kitty"
    state: link
    force: true
  become: true
  become_user: "{{ username }}"
