---
- name: Install Python LSP + robotics packages
  ansible.builtin.pip:
    name:
      - python-lsp-server
      - python-lsp-black
      - python-lsp-isort
      - pylsp-mypy
      - mypy
      - flake8
      - catkin_pkg
      - numpy
      - "empy==3.3.4"
      - lark
      - pyyaml
    state: present
    executable: "{{ mise_pip }}"
  become: true
  become_user: "{{ username }}"
