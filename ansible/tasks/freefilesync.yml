---

- name: Set FreeFileSync version
  ansible.builtin.set_fact:
    freefilesync_version: "14.12"

- name: Set FreeFileSync facts
  ansible.builtin.set_fact:
    freefilesync_archive: "FreeFileSync_{{ freefilesync_version }}_Linux_x86_64.tar.gz"
    freefilesync_installer: "FreeFileSync_{{ freefilesync_version }}_Install.run"

- name: Download FreeFileSync tarball
  ansible.builtin.get_url:
    url: "https://freefilesync.org/download/{{ freefilesync_archive }}"
    dest: "/tmp/{{ freefilesync_archive }}"
    mode: "0644"
    force: false
  when: ansible_architecture == "x86_64"

- name: Extract FreeFileSync installer from tarball
  ansible.builtin.shell: |
    set -e
    tar xzf /tmp/{{ freefilesync_archive }} -C /tmp
  args:
    executable: /bin/bash
    creates: "/tmp/{{ freefilesync_installer }}"
  when: ansible_architecture == "x86_64"

- name: Extract FreeFileSync files from installer
  ansible.builtin.shell: |
    set -e
    installer="/tmp/{{ freefilesync_installer }}"
    dest="/opt/FreeFileSync"
    mkdir -p "$dest"
    offset=$(LC_ALL=C grep -a -b -o $'\x1f\x8b\x08' "$installer" | head -n1 | cut -d: -f1)
    tail -c +$((offset + 1)) "$installer" | tar xz -C "$dest"
    chmod +x "$dest/FreeFileSync" "$dest/RealTimeSync" "$dest/Bin/FreeFileSync_x86_64" "$dest/Bin/RealTimeSync_x86_64"
  args:
    executable: /bin/bash
    creates: /opt/FreeFileSync/FreeFileSync
  when: ansible_architecture == "x86_64"
