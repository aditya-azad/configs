---
# tasks/refree.yml — clone & install refree. Runs as the user.
# Idempotent: install script re-run is safe; guarded by repo presence.

- name: Clone refree
  ansible.builtin.git:
    repo: "git@github.com:aditya-azad/refree.git"
    dest: "{{ code_dir }}/refree"
    update: true
    accept_hostkey: true
    key_file: "{{ home_dir }}/.ssh/id_ed25519"
    ssh_opts: "-o StrictHostKeyChecking=accept-new"
  become: true
  become_user: "{{ username }}"

- name: Run refree install script
  ansible.builtin.shell: |
    set -e
    cd {{ code_dir }}/refree
    chmod +x ./scripts/install.sh
    ./scripts/install.sh
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ username }}"
  changed_when: false
