# vfio — dGPU passthrough for the Windows VM (Looking-Glass display).

# ── detect passthrough hardware (dGPU, iGPU, Bluetooth, CPU IOMMU) ──────
- name: vfio — detect passthrough hardware (dGPU / iGPU / Bluetooth / IOMMU)
  ansible.builtin.shell: |
    set -uo pipefail
    # CPU vendor → IOMMU cmdline (Intel vs AMD)
    cv=$(awk -F: '/^vendor_id/{gsub(/ /,"",$2); print tolower($2); exit}' /proc/cpuinfo)
    case "$cv" in
      *amd*) iommu="amd_iommu=on iommu=pt" ;;
      *)     iommu="intel_iommu=on iommu=pt" ;;
    esac

    # NVIDIA dGPU: VGA (0300) or 3D controller (0302)
    gpu_line=$(lspci -nn | grep -iE 'VGA compatible|3D controller' | grep -i nvidia | head -1 || true)
    gpu_bdf=$(printf '%s' "$gpu_line" | awk '{print $1}')
    gpu_ids=$(printf '%s' "$gpu_line" | grep -oE '\[[0-9a-f]{4}:[0-9a-f]{4}\]' | tail -1 | tr -d '[]')
    bd=$(printf '%s' "$gpu_bdf" | awk -F. '{print $1}')        # GPU bus:device

    # NVIDIA audio (0403) on the same bus:device
    audio_line=$(lspci -nn -d 10de::0403 \
      | awk -v bd="$bd" 'bd != "" && $1 ~ "^"bd"\\." {print}' | head -1 || true)
    audio_ids=$(printf '%s' "$audio_line" | grep -oE '\[[0-9a-f]{4}:[0-9a-f]{4}\]' | tail -1 | tr -d '[]')

    # iGPU: any non-NVIDIA VGA controller (0300)
    igpu_line=$(lspci -nn -d ::0300 | grep -iv nvidia | head -1 || true)
    igpu_bdf=$(printf '%s' "$igpu_line" | awk '{print $1}')

    # Bluetooth USB adapter. /sys/class/bluetooth/*/device may point at a USB
    # *interface* (no idVendor) or at a non-USB ACL entry (hci0:256 → hci0);
    # skip non-USB entries and walk up to the USB *device* that holds
    # idVendor/idProduct.
    bt_v=""; bt_p=""
    for link in /sys/class/bluetooth/*/device; do
      [ -e "$link" ] || continue
      dev=$(readlink -f "$link")
      case "$dev" in */usb*) ;; *) continue ;; esac
      while [ "$dev" != "/" ] && [ -n "$dev" ] && [ ! -f "$dev/idVendor" ]; do
        dev=$(dirname "$dev")
      done
      if [ -f "$dev/idVendor" ]; then
        bt_v=$(cat "$dev/idVendor"  2>/dev/null || true)
        bt_p=$(cat "$dev/idProduct" 2>/dev/null || true)
        break
      fi
    done

    # by-path DRM symlinks are PCI-address-stable (no card0/card1 reordering)
    bypath() { printf '/dev/dri/by-path/pci-0000:%s-card' "$1"; }
    drm=""
    if [ -n "$igpu_bdf" ] && [ -n "$gpu_bdf" ]; then
      drm="$(bypath "$gpu_bdf"):$(bypath "$igpu_bdf")"   # dGPU first, iGPU fallback
    fi

    # vfio-pci.ids payload: gpu[,audio]
    vfio_ids="$gpu_ids"
    if [ -n "$audio_ids" ] && [ -n "$gpu_ids" ]; then vfio_ids="$gpu_ids,$audio_ids"; fi

    # BT passthrough arg (one token → word-split safely in qvm)
    bt_extra=""
    if [ -n "$bt_v" ] && [ -n "$bt_p" ]; then
      bt_extra="-device usb-host,vendorid=0x$bt_v,productid=0x$bt_p"
    fi

    printf '{"iommu":"%s","gpu_bdf":"%s","gpu_ids":"%s","audio_ids":"%s","vfio_ids":"%s","igpu_bdf":"%s","drm":"%s","bt_vendor":"%s","bt_product":"%s","bt_extra":"%s"}\n' \
      "$iommu" "$gpu_bdf" "$gpu_ids" "$audio_ids" "$vfio_ids" "$igpu_bdf" "$drm" "$bt_v" "$bt_p" "$bt_extra"
  args:
    executable: /bin/bash
  register: vfio_detect_raw
  changed_when: false

- name: vfio — parse detected hardware into facts
  ansible.builtin.set_fact:
    vfio_iommu: "{{ (vfio_detect_raw.stdout | from_json).iommu }}"
    vfio_gpu_bdf: "{{ (vfio_detect_raw.stdout | from_json).gpu_bdf }}"
    vfio_vfio_ids: "{{ (vfio_detect_raw.stdout | from_json).vfio_ids }}"
    vfio_igpu_bdf: "{{ (vfio_detect_raw.stdout | from_json).igpu_bdf }}"
    vfio_drm: "{{ (vfio_detect_raw.stdout | from_json).drm }}"
    vfio_bt_vendor: "{{ (vfio_detect_raw.stdout | from_json).bt_vendor }}"
    vfio_bt_product: "{{ (vfio_detect_raw.stdout | from_json).bt_product }}"
    vfio_bt_extra: "{{ (vfio_detect_raw.stdout | from_json).bt_extra }}"

- name: vfio — report detected hardware
  ansible.builtin.debug:
    msg: >-
      dGPU={{ vfio_gpu_bdf }} ids={{ vfio_vfio_ids }};
      iGPU={{ vfio_igpu_bdf }};
      IOMMU={{ vfio_iommu }};
      BT={{ vfio_bt_vendor }}:{{ vfio_bt_product }};
      WLR_DRM_DEVICES={{ vfio_drm }}

- name: vfio — fail if no NVIDIA dGPU was found
  ansible.builtin.fail:
    msg: >-
      No NVIDIA dGPU detected (lspci: no VGA/3D controller with vendor 10de).
      The `vfio` program only makes sense on a host with an NVIDIA dGPU.
  when: vfio_vfio_ids == ''

- name: vfio — fail on single-GPU hosts (no iGPU fallback)
  ansible.builtin.fail:
    msg: >-
      No iGPU (non-NVIDIA VGA controller) found on {{ inventory_hostname }}.
      This Looking-Glass setup needs a dual-GPU host: the iGPU keeps the
      host alive while the dGPU is passed to the VM. A single-GPU host
      requires a different, more invasive (single-GPU passthrough) design
      that is not covered here. Remove `vfio` from this host's programs.
  when: vfio_igpu_bdf == ''

# ── vfio kernel modules (vfio_virqfd / vfio_iommu_type1 live in -extra) ──
- name: vfio — install linux-modules-extra for the running kernel
  ansible.builtin.apt:
    name: "linux-modules-extra-{{ ansible_kernel }}"
    state: present

# ── Looking-Glass client build deps (built from source, pinned tag) ─────
- name: vfio — install Looking-Glass client build deps
  ansible.builtin.apt:
    name:
      - build-essential
      - cmake
      - ninja-build
      - git
      - pkg-config
      - libegl-dev
      - libegl1-mesa-dev
      - libgl1-mesa-dev
      - libgles-dev
      - libpulse-dev
      - libpipewire-0.3-dev
      - libwayland-dev
      - wayland-protocols
      - libx11-dev
      - libxfixes-dev
      - libxi-dev
      - libxpresent-dev
      - libxscrnsaver-dev
      - libxinerama-dev
      - libxcursor-dev
      - libxss-dev
      - libxrandr-dev
      - libfontconfig-dev
      - fonts-freefont-ttf
    state: present

- name: vfio — Looking-Glass paths + pinned tag
  ansible.builtin.set_fact:
    lg_tag: "B6"
    lg_src: "{{ home_dir }}/.local/src/looking-glass"
    lg_bin: "{{ home_dir }}/.local/bin/looking-glass-client"
    lg_marker: "{{ home_dir }}/.local/share/.looking-glass.tag"

- name: vfio — read installed Looking-Glass tag (if any)
  ansible.builtin.slurp:
    src: "{{ lg_marker }}"
  register: lg_installed
  failed_when: false
  changed_when: false

- name: vfio — decide whether to (re)build Looking-Glass
  ansible.builtin.set_fact:
    lg_need_build: >-
      {{
        lg_installed.failed
        or (lg_installed.content | b64decode | trim) != lg_tag
        or not (lg_bin | exists)
      }}

- name: vfio — build + install Looking-Glass client
  when: lg_need_build
  block:
    - name: ensure Looking-Glass source + build dirs
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ lg_src }}"
        - "{{ lg_src }}/client/build"
      become: true
      become_user: "{{ username }}"

    - name: clone Looking-Glass at pinned tag
      ansible.builtin.git:
        repo: "https://looking-glass.io/git/looking-glass.git"
        dest: "{{ lg_src }}"
        version: "{{ lg_tag }}"
        depth: 1
      become: true
      become_user: "{{ username }}"

    - name: configure Looking-Glass client
      ansible.builtin.command:
        cmd: "cmake -G Ninja -DENABLE_PULSEAUDIO=ON -DENABLE_PIPEWIRE=ON .."
        chdir: "{{ lg_src }}/client/build"
      become: true
      become_user: "{{ username }}"

    - name: build Looking-Glass client
      ansible.builtin.command:
        cmd: >-
          cmake --build . --parallel {{ ansible_processor_vcpus | default(4) }}
        chdir: "{{ lg_src }}/client/build"
      become: true
      become_user: "{{ username }}"

    - name: install Looking-Glass client to ~/.local/bin
      ansible.builtin.copy:
        src: "{{ lg_src }}/client/build/looking-glass-client"
        dest: "{{ lg_bin }}"
        mode: "0755"
        remote_src: true
      become: true
      become_user: "{{ username }}"

    - name: record installed Looking-Glass tag
      ansible.builtin.copy:
        content: "{{ lg_tag }}\n"
        dest: "{{ lg_marker }}"
        mode: "0644"
      become: true
      become_user: "{{ username }}"

- name: vfio — probe /boot filesystem UUID for the grub entry
  ansible.builtin.command: grub-probe --target=fs_uuid /boot
  register: boot_fs_uuid
  changed_when: false

- name: vfio — write the Windows-VFIO grub custom menuentry
  ansible.builtin.copy:
    dest: /etc/grub.d/40_windows_vfio
    mode: "0755"
    content: |
      #!/bin/sh
      exec tail -n +3 "$0"
      # Managed by configs-ansible (ansible/tasks/vfio.yml) — do not edit by hand.
      # Reserves the NVIDIA dGPU + its audio ({{ vfio_vfio_ids }}) for the Windows
      # VM via vfio-pci and keeps nvidia off the dGPU this boot only.
      # Boot the normal "Ubuntu" entry to give the dGPU back to the host.
      menuentry "Ubuntu (Windows VFIO / Looking-Glass)" {
          search --no-floppy --fs-uuid --set=root {{ boot_fs_uuid.stdout }}
          linux {{ ansible_cmdline.BOOT_IMAGE }} root={{ ansible_cmdline.root }} ro {{ vfio_iommu }} pcie_acs_override=downstream vfio-pci.ids={{ vfio_vfio_ids }} module_blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm,nvidia_wmi_ec_backlight
          initrd {{ ansible_cmdline.BOOT_IMAGE | regex_replace('vmlinuz', 'initrd.img') }}
      }
  register: grub_vfio_entry

- name: vfio — regenerate grub.cfg (only when the menuentry changed)
  ansible.builtin.command: update-grub
  when: grub_vfio_entry.changed

- name: vfio — qvm passthrough env (bashrc)
  ansible.builtin.blockinfile:
    path: "{{ bashrc_file }}"
    marker: "# {mark} ANSIBLE qvm-vfio"
    block: |
      # Detected by ansible/tasks/vfio.yml — dGPU (+audio) for vfio-pci, and
      # the Bluetooth USB adapter passed to the Windows VM for BT-speaker audio.
      export VM_VFIO_DEVS="{{ vfio_vfio_ids | replace(',', ' ') }}"
      export VM_EXTRA_ARGS="{{ vfio_bt_extra }}"
  become: true
  become_user: "{{ username }}"

- name: vfio — ensure ~/.config/environment.d exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.config/environment.d"
    state: directory
    mode: "0755"
  become: true
  become_user: "{{ username }}"

- name: vfio — write WLR_DRM_DEVICES (dGPU first, iGPU fallback)
  ansible.builtin.copy:
    dest: "{{ home_dir }}/.config/environment.d/umbriel-drm.conf"
    mode: "0644"
    content: "WLR_DRM_DEVICES={{ vfio_drm }}\n"
  become: true
  become_user: "{{ username }}"

- name: vfio — udev rule granting the user the Bluetooth USB adapter
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/99-qvm-bluetooth.rules
    mode: "0644"
    content: |
      # Managed by configs-ansible (ansible/tasks/vfio.yml) — do not edit by hand.
      # Let {{ username }} pass the Bluetooth USB adapter
      # ({{ vfio_bt_vendor }}:{{ vfio_bt_product }}) to the Windows VM via
      # QEMU usb-host for direct BT-speaker audio.
      SUBSYSTEM=="usb", ATTRS{idVendor}=="{{ vfio_bt_vendor }}", ATTRS{idProduct}=="{{ vfio_bt_product }}", OWNER="{{ username }}", MODE="0660"
  register: bt_udev_rule
  when: vfio_bt_vendor != ''

- name: vfio — reload udev rules + retrigger the BT adapter (only on change)
  ansible.builtin.command: >-
    udevadm control --reload-rules
    && udevadm trigger --subsystem-match=usb
       --attr-match=idVendor={{ vfio_bt_vendor }}
       --attr-match=idProduct={{ vfio_bt_product }}
  when: vfio_bt_vendor != '' and bt_udev_rule.changed
