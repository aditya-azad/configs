---
# tasks/neovim.yml — build Neovim release-0.13 from source. Runs as the user.
# Idempotent: skipped if /usr/local/bin/nvim exists.

- name: Ensure build deps present
  ansible.builtin.apt:
    name:
      - ninja-build
      - gettext
      - cmake
      - unzip
      - curl
      - build-essential
    state: present

- name: Clone neovim (release-0.13)
  ansible.builtin.git:
    repo: https://github.com/neovim/neovim
    dest: "{{ code_dir }}/neovim"
    version: release-0.13
    depth: 1
  become: true
  become_user: "{{ username }}"

- name: Build neovim (RelWithDebInfo)
  ansible.builtin.shell: |
    set -e
    cd {{ code_dir }}/neovim
    make CMAKE_BUILD_TYPE=RelWithDebInfo
  args:
    executable: /bin/bash
    creates: "{{ code_dir }}/neovim/build/bin/nvim"
  become: true
  become_user: "{{ username }}"

- name: Install neovim system-wide
  ansible.builtin.shell: make install
  args:
    chdir: "{{ code_dir }}/neovim"
    creates: /usr/local/bin/nvim
