---
- name: Install mise (creates ~/.local/bin/mise)
  ansible.builtin.shell: |
    set -e
    curl https://mise.run | sh
  args:
    creates: "{{ mise_bin }}"
    executable: /bin/bash
  become: true
  become_user: "{{ username }}"

- name: Pin python@3.14 as the global default (mise)
  ansible.builtin.shell: |
    set -e
    eval "$({{ mise_bin }} activate bash)"
    {{ mise_bin }} use -g python@3.14
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ username }}"
  register: mise_py
  changed_when: >-
    ('already' not in ((mise_py.stdout | default('')) ~ (mise_py.stderr | default(''))) | lower)
    and ((mise_py.stdout | default('')) ~ (mise_py.stderr | default(''))) | trim != ''

- name: Ensure pip is present and current for the global python
  ansible.builtin.shell: |
    set -e
    eval "$({{ mise_bin }} activate bash)"
    python -m pip install --upgrade pip
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ username }}"
  register: mise_pip_up
  changed_when: "'Successfully installed' in (mise_pip_up.stdout | default(''))"

