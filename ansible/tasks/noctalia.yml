- name: Noctalia — install desktop shell
  ansible.builtin.apt:
    name: noctalia
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Noctalia — install recommended desktop apps
  ansible.builtin.apt:
    name:
      - thunar
      - thunar-archive-plugin
      - thunar-volman
      - file-roller
      - gvfs
      - gvfs-backends
      - mpv
      - imv
      - zathura
      - zathura-pdf-poppler
      - zathura-djvu
      - zathura-cb
      - qalculate-gtk
      - blueman
      - pavucontrol
      - brightnessctl
    state: present

- name: Noctalia — install audio stack (PipeWire)
  ansible.builtin.apt:
    name:
      - pipewire
      - pipewire-pulse
      - wireplumber
    state: present

- name: Noctalia — install XDG desktop portal base
  ansible.builtin.apt:
    name:
      - xdg-desktop-portal
      - xdg-desktop-portal-gtk
    state: present

- name: Noctalia — ensure ~/.config/noctalia exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.config/noctalia"
    state: directory
    mode: "0755"
  become: true
  become_user: "{{ username }}"

- name: Noctalia — link config.toml
  ansible.builtin.file:
    src: "{{ configs_repo }}/noctalia/noctalia/config.toml"
    dest: "{{ home_dir }}/.config/noctalia/config.toml"
    state: link
    force: true
  become: true
  become_user: "{{ username }}"

- name: Noctalia — GTK / interface settings
  ansible.builtin.shell: "gsettings set {{ item.schema }} {{ item.key }} \"{{ item.value }}\""
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ username }}"
  changed_when: false
  loop:
    - { schema: "org.gnome.desktop.interface", key: "icon-theme", value: "Yaru" }
    - { schema: "org.gnome.desktop.interface", key: "gtk-theme", value: "Adwaita" }
    - { schema: "org.gnome.desktop.interface", key: "enable-animations", value: "false" }
    - { schema: "org.gnome.desktop.interface", key: "clock-format", value: "'12h'" }
    - { schema: "org.gnome.desktop.peripherals.keyboard", key: "delay", value: "150" }
    - { schema: "org.gnome.desktop.input-sources", key: "xkb-options", value: "['caps:none']" }

- name: Noctalia — default browser & terminal
  ansible.builtin.shell: "{{ item }}"
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ username }}"
  changed_when: false
  loop:
    - "xdg-settings set default-web-browser brave-browser.desktop"
    - "gsettings set org.gnome.desktop.default-applications.terminal exec 'kitty'"
    - "gsettings set org.gnome.desktop.default-applications.terminal exec-arg ''"

- name: Noctalia — register kitty as x-terminal-emulator alternative
  ansible.builtin.shell: |
    update-alternatives --install /usr/bin/x-terminal-emulator x-terminal-emulator "$(which kitty)" 50
  args:
    executable: /bin/bash
  changed_when: false

- name: Plymouth — install simple spinner theme
  ansible.builtin.apt:
    name: plymouth-theme-spinner
    state: present

- name: Plymouth — read current default theme
  ansible.builtin.command: plymouth-set-default-theme
  changed_when: false
  register: plymouth_current_theme
  failed_when: false

- name: Plymouth — set spinner as default theme + rebuild initrd
  ansible.builtin.command: plymouth-set-default-theme -R spinner
  when: plymouth_current_theme.stdout | trim != 'spinner'

- name: Noctalia — logind lid-close = ignore
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/lid.conf
    mode: "0644"
    content: |
      [Login]
      HandleLidSwitch=ignore
      HandleLidSwitchExternalMonitors=ignore
      HandleLidSwitchDocked=ignore
