---
# tasks/bashrc_common.yml — common shell aliases/env for all hosts.
# Idempotent: every contribution is a marked blockinfile block in ~/.bashrc.

- name: Common bashrc — system shortcuts
  ansible.builtin.blockinfile:
    path: "{{ bashrc_file }}"
    marker: "# {mark} ANSIBLE common-system-shortcuts"
    block: |
      alias start='xdg-open'
      alias brc='nvim ~/.bashrc'
      alias dev='./scripts/dev.sh'

- name: Common bashrc — ~/.local/bin on PATH
  ansible.builtin.blockinfile:
    path: "{{ bashrc_file }}"
    marker: "# {mark} ANSIBLE common-local-bin-path"
    block: |
      case ":$PATH:" in
        *:"$HOME/.local/bin":*) ;;
        *) export PATH="$HOME/.local/bin:$PATH" ;;
      esac

- name: Common bashrc — directories
  ansible.builtin.blockinfile:
    path: "{{ bashrc_file }}"
    marker: "# {mark} ANSIBLE common-directories"
    block: |
      alias cdc='cd ~/code'
      alias cdd='cd ~/Downloads'

- name: Common bashrc — venvup + rdid sourced helpers
  ansible.builtin.blockinfile:
    path: "{{ bashrc_file }}"
    marker: "# {mark} ANSIBLE common-helpers"
    block: |
      [ -f "$HOME/.local/lib/venvup" ] && source "$HOME/.local/lib/venvup"
      [ -f "$HOME/.local/lib/rdid" ]   && source "$HOME/.local/lib/rdid"

- name: Common bashrc — utils
  ansible.builtin.blockinfile:
    path: "{{ bashrc_file }}"
    marker: "# {mark} ANSIBLE common-utils"
    block: |
      alias z='zellij'
      alias tmux='zellij'
      alias scp='rsync -avP'

- name: Common bashrc — editor
  ansible.builtin.blockinfile:
    path: "{{ bashrc_file }}"
    marker: "# {mark} ANSIBLE common-editor"
    block: |
      alias vim='nvim'
      alias vi='nvim'
      export EDITOR=nvim

- name: Common bashrc — vi bindings
  ansible.builtin.blockinfile:
    path: "{{ bashrc_file }}"
    marker: "# {mark} ANSIBLE common-vi-bindings"
    block: |
      set -o vi
      bind -m vi-command 'Control-l: clear-screen'
      bind -m vi-insert 'Control-l: clear-screen'

- name: Common bashrc — robotics
  ansible.builtin.blockinfile:
    path: "{{ bashrc_file }}"
    marker: "# {mark} ANSIBLE common-robotics"
    block: |
      export PATH=${PATH}:/usr/src/tensorrt/bin/
      alias r2='source /opt/ros/humble/setup.bash'
      alias ws='source ./install/setup.bash'
      alias cws='rm -rf ./build ./install ./log'
      alias bws='colcon build --symlink-install'
      alias chrons='chronyc sources'
      alias chronr='sudo systemctl restart chronyd'
      alias chronc='sudo nvim /etc/chrony/chrony.conf'
      alias acp='source ~/code/acp_ws/install/setup.bash'
      export ROS_LOCALHOST_ONLY=0
      export RMW_IMPLEMENTATION=rmw_cyclonedds_cpp

- name: Common bashrc — mise activation
  ansible.builtin.blockinfile:
    path: "{{ bashrc_file }}"
    marker: "# {mark} ANSIBLE common-mise"
    block: |
      eval "$(~/.local/bin/mise activate bash)"
