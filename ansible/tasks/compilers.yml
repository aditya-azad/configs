---

- name: Install compiler/build dependencies
  ansible.builtin.apt:
    name:
      - git
      - build-essential
      - ninja-build
      - gettext
      - cmake
      - unzip
      - curl
      - xclip
      - g++
      - pkg-config
      - libfontconfig1-dev
      - libxcb-xfixes0-dev
      - libxkbcommon-dev
      - python3-pip
    state: present
