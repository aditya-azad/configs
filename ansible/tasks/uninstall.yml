---
# tasks/uninstall.yml — strip telemetry / crash-reporting / snap from the
# base install so only selected programs remain.

- name: Remove telemetry / crash-reporting / snap (apt, purge)
  ansible.builtin.apt:
    name:
      - apport
      - apport-symptoms
      - whoopsie
      - whoopsie-preferences
      - ubuntu-report
      - ubuntu-pro-client
      - landscape-client
      - popularity-contest
      - motd-news-config
      - snapd
      - fwupd-snap
    state: absent
    purge: true
  failed_when: false

- name: Clean up now-unused dependencies (final autoremove)
  ansible.builtin.apt:
    autoremove: true
    purge: true
