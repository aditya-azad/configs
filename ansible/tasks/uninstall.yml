---

- name: Remove Firefox snap
  ansible.builtin.shell: snap remove --purge firefox
  register: snap_firefox
  changed_when: "'removed' in (snap_firefox.stdout | lower)"
  failed_when: false

- name: Remove Thunderbird snap
  ansible.builtin.shell: snap remove --purge thunderbird
  register: snap_thunderbird
  changed_when: "'removed' in (snap_thunderbird.stdout | lower)"
  failed_when: false

- name: Remove bloat (transitional apt stubs)
  ansible.builtin.apt:
    name:
      - firefox
      - thunderbird
    state: absent
    purge: true
  failed_when: false

- name: Clean up now-unused dependencies (final autoremove)
  ansible.builtin.apt:
    autoremove: true
    purge: true
