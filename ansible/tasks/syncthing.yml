---

- name: Set syncthing archive facts
  ansible.builtin.set_fact:
    syncthing_version: "2.0.11"
    syncthing_arch_dir: >-
      {{ 'syncthing-linux-amd64-v2.0.11' if ansible_architecture == 'x86_64' else 'syncthing-linux-arm64-v2.0.11' }}
    syncthing_archive: >-
      {{ 'syncthing-linux-amd64-v2.0.11.tar.gz' if ansible_architecture == 'x86_64' else 'syncthing-linux-arm64-v2.0.11.tar.gz' }}

- name: Download syncthing archive
  ansible.builtin.get_url:
    url: "https://github.com/syncthing/syncthing/releases/download/v{{ syncthing_version }}/{{ syncthing_archive }}"
    dest: "/tmp/{{ syncthing_archive }}"
    mode: "0644"
    force: false
  become: true
  become_user: "{{ username }}"

- name: Extract syncthing to ~/syncthing (skip if already installed)
  ansible.builtin.shell: |
    set -e
    cd {{ home_dir }}
    tar xzf /tmp/{{ syncthing_archive }}
    rm -rf syncthing
    mv {{ syncthing_arch_dir }} syncthing
  args:
    executable: /bin/bash
    creates: "{{ home_dir }}/syncthing/syncthing"
  become: true
  become_user: "{{ username }}"

- name: Ensure user systemd dir exists
  ansible.builtin.file:
    path: "{{ home_dir }}/.config/systemd/user"
    state: directory
    mode: "0755"
  become: true
  become_user: "{{ username }}"

- name: Install syncthing user unit
  ansible.builtin.copy:
    src: "{{ home_dir }}/syncthing/etc/linux-systemd/user/syncthing.service"
    dest: "{{ home_dir }}/.config/systemd/user/syncthing.service"
    remote_src: true
    mode: "0644"
    force: true
  become: true
  become_user: "{{ username }}"

- name: Add syncthing to PATH (bashrc)
  ansible.builtin.blockinfile:
    path: "{{ bashrc_file }}"
    marker: "# {mark} ANSIBLE syncthing-path"
    block: |
      export PATH=${PATH}:${HOME}/syncthing/
  become: true
  become_user: "{{ username }}"

- name: Enable & start syncthing user service
  ansible.builtin.systemd:
    name: syncthing.service
    scope: user
    daemon_reload: true
    enabled: true
    state: started
  become: true
  become_user: "{{ username }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ user_uid }}"
