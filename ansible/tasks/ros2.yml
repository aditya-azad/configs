---
# tasks/ros2.yml — ROS 2 Humble desktop + dev tools (desktop, x86_64).

- name: Install software-properties-common
  ansible.builtin.apt:
    name: software-properties-common
    state: present

- name: Enable universe repository
  ansible.builtin.shell: add-apt-repository universe -y
  args:
    executable: /bin/bash
  changed_when: false

- name: Install curl
  ansible.builtin.apt:
    name: curl
    state: present
    update_cache: true

- name: Detect latest ros-apt-source release tag
  ansible.builtin.shell: |
    set -e
    curl -s https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest \
      | grep -F "tag_name" | awk -F\" '{print $4}'
  args:
    executable: /bin/bash
  register: ros_apt_version
  changed_when: false

- name: Determine Ubuntu codename
  ansible.builtin.shell: . /etc/os-release && echo "${UBUNTU_CODENAME:-${VERSION_CODENAME}}"
  args:
    executable: /bin/bash
  register: ubuntu_codename
  changed_when: false

- name: Download ros2-apt-source deb
  ansible.builtin.get_url:
    url: "https://github.com/ros-infrastructure/ros-apt-source/releases/download/{{ ros_apt_version.stdout }}/ros2-apt-source_{{ ros_apt_version.stdout }}.{{ ubuntu_codename.stdout }}_all.deb"
    dest: /tmp/ros2-apt-source.deb
    mode: "0644"
    force: true

- name: Install ros2-apt-source deb
  ansible.builtin.apt:
    deb: /tmp/ros2-apt-source.deb
    state: present
    update_cache: true

- name: Install ros-humble-desktop
  ansible.builtin.apt:
    name: ros-humble-desktop
    state: present

- name: Install ros-dev-tools
  ansible.builtin.apt:
    name: ros-dev-tools
    state: present
