# apt deps
- name: Local scripts — install common deps
  ansible.builtin.apt:
    name:
      - jq
      - zip
      - gh
      - distrobox
      - openconnect
    state: present

- name: Local scripts — install QEMU/KVM/OVMF deps (x86_64 desktop)
  ansible.builtin.apt:
    name:
      - qemu-system
      - qemu-utils
      - swtpm
      - virt-viewer
      - ovmf
    state: present
  when: ansible_architecture == "x86_64"

# dirs
- name: Ensure ~/.local/{bin,lib,share} and ~/.vms exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  become: true
  become_user: "{{ username }}"
  loop:
    - "{{ home_dir }}/.local/bin"
    - "{{ home_dir }}/.local/lib"
    - "{{ home_dir }}/.local/share"
    - "{{ home_dir }}/.vms"
    - "{{ home_dir }}/.vms/windows"

# st
- name: Deploy theme-switch dir to ~/.local/share/theme-switch
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/packages/theme-switch/"
    dest: "{{ home_dir }}/.local/share/theme-switch/"
    mode: preserve
  become: true
  become_user: "{{ username }}"

- name: Make st executable
  ansible.builtin.file:
    path: "{{ home_dir }}/.local/share/theme-switch/st"
    mode: "0755"
  become: true
  become_user: "{{ username }}"

- name: Link st into ~/.local/bin
  ansible.builtin.file:
    src: "{{ home_dir }}/.local/share/theme-switch/st"
    dest: "{{ home_dir }}/.local/bin/st"
    state: link
    force: true
  become: true
  become_user: "{{ username }}"

