---
# tasks/symlinks_desktop.yml — desktop-only config symlinks (kitty, refree, syncthing keys).

- name: Link kitty config
  ansible.builtin.file:
    src: "{{ configs_repo }}/kitty"
    dest: "{{ ansible_env.HOME }}/.config/kitty"
    state: link
    force: true
  become: false

- name: Link refree config
  ansible.builtin.file:
    src: "{{ configs_repo }}/refree"
    dest: "{{ ansible_env.HOME }}/.refree"
    state: link
    force: true
  become: false

- name: Ensure ~/.config/hypr exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/hypr"
    state: directory
    mode: "0755"
  become: false

- name: Link hyprland.lua config
  ansible.builtin.file:
    src: "{{ configs_repo }}/hypr/hyprland.lua"
    dest: "{{ ansible_env.HOME }}/.config/hypr/hyprland.lua"
    state: link
    force: true
  become: false
